<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Laboratorio del avatar lector de LIAM</title>
  <script type="module" src="../vendor/model-viewer/model-viewer-4.3.1.min.js"></script>
  <style>
    :root{color-scheme:dark;font-family:Inter,system-ui,sans-serif;background:#020617;color:#e2e8f0}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 35%,#123a63 0,#071525 38%,#020617 72%)}
    main{width:min(900px,calc(100vw - 24px));display:grid;grid-template-columns:minmax(280px,1fr) minmax(250px,.65fr);gap:22px;padding:22px}
    .stage,.panel{border:1px solid #22d3ee55;background:#071525d9;border-radius:24px;box-shadow:0 24px 70px #0008}.stage{height:min(68vh,520px);overflow:hidden;position:relative}
    model-viewer{width:100%;height:100%;background:transparent}.badge{z-index:2;position:absolute;top:18px;left:18px;padding:8px 12px;border-radius:99px;background:#0f172acc;border:1px solid #22d3ee66;font-size:12px;letter-spacing:.1em}
    .panel{align-self:center;padding:24px}.panel h1{margin:0;color:#67e8f9}.panel p{color:#94a3b8;line-height:1.55}.status{font-size:13px;color:#a5f3fc;overflow-wrap:anywhere}
    @media(max-width:720px){main{width:100%;grid-template-columns:1fr;padding:12px}.stage{height:58vh}.panel{padding:18px}.panel p{display:none}}
  </style>
</head>
<body>
  <main>
    <section class="stage"><span class="badge">LIAM LECTOR · MODELO ESTÁTICO</span><model-viewer id="liam" alt="LIAM, avatar lector estático" camera-controls disable-pan disable-zoom interaction-prompt="none" shadow-intensity="0" environment-image="neutral" exposure="1" camera-orbit="0deg 90deg 1.7m" camera-target="0m .42m 0m" field-of-view="36deg" poster="../assets/lia/3d/liam-lector-frontal.png"></model-viewer></section>
    <section class="panel"><h1>LIAM lector</h1><p>Revisión aislada de apariencia. El modelo es un busto estático: la voz, el chat, los recorridos y los controles pertenecen al asistente existente.</p><div id="status" class="status" role="status">Cargando modelo…</div></section>
  </main>
  <script>
    const viewer=document.getElementById('liam'),status=document.getElementById('status');
    const compact=matchMedia('(max-width:768px)').matches;
    viewer.setAttribute('src',compact?'../assets/lia/3d/liam-lector-movil.glb':'../assets/lia/3d/liam-lector.glb');
    if(compact)viewer.setAttribute('camera-orbit','0deg 90deg 1.9m');
    viewer.addEventListener('load',()=>{status.textContent=`Modelo listo · ${viewer.availableAnimations.length} animaciones (esperadas: 0)`;});
    viewer.addEventListener('error',()=>{status.textContent='No fue posible cargar el 3D; se conserva la imagen frontal de respaldo.';});
  </script>
</body>
</html>
