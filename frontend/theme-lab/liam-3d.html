<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Laboratorio 3D de LIAM</title>
  <script type="module" src="../vendor/model-viewer/model-viewer-4.3.1.min.js"></script>
  <style>
    :root{color-scheme:dark;font-family:Inter,system-ui,sans-serif;background:#020617;color:#e2e8f0}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;overflow-x:hidden;display:grid;place-items:center;background:radial-gradient(circle at 50% 35%,#123a63 0,#071525 38%,#020617 72%)}
    main{width:min(920px,calc(100vw - 24px));min-width:0;display:grid;grid-template-columns:minmax(280px,1fr) minmax(260px,.72fr);gap:22px;padding:22px}
    .stage,.panel{min-width:0;border:1px solid #22d3ee55;background:#071525d9;border-radius:24px;box-shadow:0 24px 70px #0008}.stage{height:min(68vh,520px);overflow:hidden;position:relative}
    model-viewer{width:100%;height:100%;background:transparent}.fallback{display:none;width:100%;height:100%;object-fit:contain}.stage[data-fallback="true"] model-viewer{display:none}.stage[data-fallback="true"] .fallback{display:block}.badge{z-index:2;position:absolute;top:18px;left:18px;padding:8px 12px;border-radius:99px;background:#0f172acc;border:1px solid #22d3ee66;font-size:12px;letter-spacing:.12em}
    .panel{align-self:center;padding:24px}.panel h1{margin:0;color:#67e8f9}.panel p{color:#94a3b8;line-height:1.55}.controls{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}button{min-width:0;border:1px solid #22d3ee66;border-radius:12px;background:#0f2942;color:#e6fbff;padding:11px;cursor:pointer}button:hover,button:focus-visible{background:#16476a;outline:2px solid #67e8f9}.status{margin-top:16px;font-size:13px;color:#a5f3fc;overflow-wrap:anywhere}
    @media(max-width:720px){main{width:100%;max-width:100%;grid-template-columns:minmax(0,1fr);padding:12px}.stage{height:58vh}.panel{padding:18px}.panel p{display:none}.controls{grid-template-columns:minmax(0,1fr)}}
    @media(prefers-reduced-motion:reduce){.controls{display:none}}
  </style>
</head>
<body>
  <main>
    <section class="stage"><span class="badge">PRODUCCIÓN V1 · TEXTURAS PBR</span><img class="fallback" src="../assets/lia/liam-afro-institutional-fullbody-v2.png" alt="LIAM en respaldo 2D"><model-viewer id="liam" src="../assets/lia/3d/liam-produccion-v1.glb" alt="LIAM, asistente virtual 3D" camera-controls interaction-prompt="none" shadow-intensity=".35" environment-image="neutral" exposure="1.25" camera-orbit="8deg 82deg 4.3m" field-of-view="30deg" autoplay></model-viewer></section>
    <section class="panel"><h1>LIAM 3D</h1><p>Laboratorio aislado para revisar el modelo, el rendimiento y sus clips antes de habilitarlo en la plataforma.</p><div class="controls"><button data-clip="Idle">Reposo</button><button data-clip="Walk">Caminar</button><button data-clip="Wave">Saludar</button><button data-clip="Point">Señalar</button><button data-clip="Talk">Hablar</button><button data-clip="Listen">Escuchar</button><button data-clip="Think">Pensar</button></div><div id="status" class="status" role="status">Cargando modelo…</div></section>
  </main>
  <script>
    const viewer=document.getElementById('liam'),status=document.getElementById('status');
    if(matchMedia('(max-width:720px)').matches)viewer.setAttribute('camera-orbit','6deg 82deg 4.8m');
    viewer.addEventListener('load',()=>{status.textContent=`Modelo listo · ${viewer.availableAnimations.length} animaciones: ${viewer.availableAnimations.join(', ')}`;viewer.animationName='Idle';viewer.play()});
    viewer.addEventListener('error',event=>{viewer.closest('.stage').dataset.fallback='true';status.textContent=`No fue posible cargar el modelo (${event.detail?.type||'error desconocido'}); se conserva el respaldo 2D.`});
    document.querySelector('.controls').addEventListener('click',event=>{const clip=event.target.dataset.clip;if(!clip)return;viewer.animationName=clip;viewer.play({repetitions:['Wave','Point'].includes(clip)?2:Infinity});status.textContent=`Reproduciendo: ${clip}`});
  </script>
</body>
</html>
